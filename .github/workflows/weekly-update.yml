name: Weekly funding update

on:
  schedule:
    - cron: "30 3 * * 1"   # every Monday 09:00 IST
  workflow_dispatch:
    inputs:
      days:
        description: "Look back N days (blank = since last run; use 90 for the first backfill)"
        required: false
        default: ""
      refresh_insights:
        description: "Regenerate every sector note"
        type: boolean
        default: false
      reprocess:
        description: "Re-read articles already processed (e.g. after adding the API key)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: funding-update
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests
      - name: Crawl and extract
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.days }}" ]; then ARGS="$ARGS --days ${{ inputs.days }}"; fi
          if [ "${{ inputs.refresh_insights }}" = "true" ]; then ARGS="$ARGS --refresh-insights"; fi
          if [ "${{ inputs.reprocess }}" = "true" ]; then ARGS="$ARGS --reprocess"; fi
          python -m scraper.run $ARGS
      - name: Commit data
        run: |
          git config user.name "funding-tracker-bot"
          git config user.email "funding-tracker-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Data update $(date -u +%Y-%m-%d)"
          git push

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
